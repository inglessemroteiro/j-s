<title>ibis Den Haag Guest Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* baseline first, so the design's own helmet CSS below still wins */
:root { color-scheme: light; }
html { background: #F6F4F2; }
body { margin: 0; background: #F6F4F2; color: #1E1E1E;
  font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
body{margin:0;background:#F6F4F2;color:#1E1E1E;font-family:'Nunito Sans',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:#A50034}a:hover{color:#1E1E1E}
button,textarea{font-family:inherit}
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#003271}a:hover{color:#F26B21}
textarea{font-family:inherit}
button{font-family:inherit}
</style>

<div id="pitch-root"></div>

<template id="tpl-pitch"><div style="min-height:100vh;display:flex;flex-direction:column">
  <div style="background:#A50034;color:#fff;font-size:15px;font-weight:600;padding:11px 0">
    <div style="max-width:960px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline">
      <span>A creative application for the Front Office Employee position by Gabriela Souza.</span>
      <span style="font-weight:400;color:rgba(255,255,255,.75)">Two steps: try the phone version as a guest, then read why I built it.</span>
    </div>
  </div>
  <header style="background:#1E1E1E;color:#fff;padding:36px 0 0">
    <div style="max-width:960px;margin:0 auto;padding:0 24px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:8px;background:#A50034;color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;flex:0 0 40px">{{ hotel.mark }}</div>
        <div style="line-height:1.15"><div style="font-size:16px;font-weight:700">{{ hotel.name }}</div><div style="font-size:13px;color:rgba(255,255,255,.72)">{{ hotel.line }}</div></div>
      </div>
      <h1 style="font-size:clamp(30px,5.2vw,50px);line-height:1.06;font-weight:700;margin:26px 0 12px;max-width:18ch;letter-spacing:-.02em;text-wrap:pretty">Welcome. How much time do you have?</h1>
      <p style="margin:0;max-width:60ch;color:rgba(255,255,255,.82);font-size:17px;text-wrap:pretty">Guests ask our front desk this every day, and we would like to answer it well every time. Tell us three things and we will suggest three places nearby, all of them chosen by the people who work here.</p>
      <div role="tablist" style="display:flex;flex-wrap:wrap;margin-top:30px;border-bottom:1px solid rgba(255,255,255,.22)">
        <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3">
          <button role="tab" aria-selected="{{ tb.on }}" onClick="{{ tb.pick }}" style="appearance:none;border:0;background:none;color:{{ tb.fg }};cursor:pointer;font-weight:600;font-size:15px;padding:12px 18px;border-bottom:3px solid {{ tb.line }};margin-bottom:-1px;white-space:nowrap;flex:none">{{ tb.label }}</button>
        </sc-for>
      </div>
    </div>
  </header>

  <main style="flex:1;padding:44px 0 80px">
    <div style="max-width:960px;margin:0 auto;padding:0 24px">

      <sc-if value="{{ isGuest }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-wrap:wrap;gap:40px 56px;align-items:flex-start">
          <div style="flex:1 1 280px;min-width:0;max-width:520px">
            <p style="font-size:13px;color:#A50034;font-weight:700;margin:0 0 8px;letter-spacing:.06em;text-transform:uppercase;color:#A50034">What the guest sees</p>
            <h2 style="font-size:26px;line-height:1.2;margin:0 0 12px;font-weight:700;color:#A50034;letter-spacing:-.01em;text-wrap:pretty">A page on their own phone, opened from a QR card at the desk</h2>
            <p style="color:#6B6461;margin:0 0 26px;text-wrap:pretty">The phone on the right is live. Tap through it exactly as a guest would. Everything it suggests is within easy reach of the hotel, opening times are checked against the real day and hour, and I have verified them myself.</p>
            <div style="display:flex;flex-direction:column;gap:0">
              <div style="display:flex;gap:16px;padding:16px 0;border-top:1px solid #DDD7D2"><span style="flex:0 0 32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">1</span><div><b style="color:#A50034">Pick a language</b><p style="margin:4px 0 0;color:#6B6461;font-size:15.5px;text-wrap:pretty">English, Nederlands, Deutsch or Espa&#xF1;ol. The choice itself tells the desk who is staying with us this month.</p></div></div>
              <div style="display:flex;gap:16px;padding:16px 0;border-top:1px solid #DDD7D2"><span style="flex:0 0 32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">2</span><div><b style="color:#A50034">Answer three questions</b><p style="margin:4px 0 0;color:#6B6461;font-size:15.5px;text-wrap:pretty">How much time they have, who is with them, and what they would enjoy most right now.</p></div></div>
              <div style="display:flex;gap:16px;padding:16px 0;border-top:1px solid #DDD7D2"><span style="flex:0 0 32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">3</span><div><b style="color:#A50034">Get three places, chosen by us</b><p style="margin:4px 0 0;color:#6B6461;font-size:15.5px;text-wrap:pretty">Only places open right now, nearest first, with walking time, a tip from the desk and, where we have arranged one, a small welcome. Plus one a little further, if there is time. Tap a name for Instagram, an address for the map.</p></div></div>
              <div style="display:flex;gap:16px;padding:16px 0;border-top:1px solid #DDD7D2;border-bottom:1px solid #DDD7D2"><span style="flex:0 0 32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">4</span><div><b style="color:#A50034">Tell us how it went</b><p style="margin:4px 0 0;color:#6B6461;font-size:15.5px;text-wrap:pretty">The suggestions stay on their phone for the whole stay. When they come back, two taps per place tell us whether they went and whether they would recommend it.</p></div></div>
            </div>
            <p style="margin:26px 0 0;font-size:15px;color:#6B6461;text-wrap:pretty">That is the guest side. Why it matters to the hotel is in step 2, <b style="color:#A50034">Why I built this</b>, at the top of the page.</p>
          </div>
          <div style="flex:0 0 auto;max-width:100%;overflow:hidden">
            <dc-import name="Holiday Inn Express Guest App" show-notes="{{ false }}" hotel="{{ hotelKey }}" theme="ibis" hint-size="402px,874px"></dc-import>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isHotel }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px 48px;align-items:start;margin:0 0 40px">
          <h2 style="font-size:clamp(28px,3.6vw,38px);line-height:1.12;margin:0;font-weight:700;color:#A50034;letter-spacing:-.015em;text-wrap:pretty">Every day, guests ask the desk what to do. We never write the answer down.</h2>
          <p style="color:#6B6461;margin:0;font-size:17.5px;text-wrap:pretty">The vacancy asks for someone who gives guests tourist information, goes the extra mile and brings their own ideas. This is mine. It is a small tool I built and tested before applying, so that the hotel can answer that daily question well every time, learn from it, and turn it into the kind of moment guests mention in their reviews.</p>
        </div>
        <div style="margin:0 0 40px;padding-top:28px;border-top:1px solid #DDD7D2">
          <h3 style="font-size:20px;margin:0 0 18px;font-weight:700;color:#A50034">How it works</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
            <div style="display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:14px 14px 16px;min-width:0">
              <span style="width:32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">1</span>
              <b style="color:#A50034;font-size:16.5px;line-height:1.25">A QR card at the desk</b>
              <p style="margin:0;color:#6B6461;font-size:15px;line-height:1.5;text-wrap:pretty">A guest scans it on their own phone and answers three questions: the time they have, who they are travelling with and what they would like to do.</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:14px 14px 16px;min-width:0">
              <span style="width:32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">2</span>
              <b style="color:#A50034;font-size:16.5px;line-height:1.25">Three suggestions</b>
              <p style="margin:0;color:#6B6461;font-size:15px;line-height:1.5;text-wrap:pretty">Chosen by our own team, with opening times we have checked ourselves. They stay on the guest&#x2019;s phone for the whole stay, so nobody has to ask twice.</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:14px 14px 16px;min-width:0">
              <span style="width:32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">3</span>
              <b style="color:#A50034;font-size:16.5px;line-height:1.25">The same answer on every shift</b>
              <p style="margin:0;color:#6B6461;font-size:15px;line-height:1.5;text-wrap:pretty">Every guest receives the same considered suggestion, whoever happens to be at the desk that day.</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:14px 14px 16px;min-width:0">
              <span style="width:32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">4</span>
              <b style="color:#A50034;font-size:16.5px;line-height:1.25">A record we do not have today</b>
              <p style="margin:0;color:#6B6461;font-size:15px;line-height:1.5;text-wrap:pretty">We learn what our guests ask for. At present those conversations happen at the desk and are never written down.</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:14px 14px 16px;min-width:0">
              <span style="width:32px;height:32px;border-radius:50%;background:#A50034;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px">5</span>
              <b style="color:#A50034;font-size:16.5px;line-height:1.25">A welcome from our partners</b>
              <p style="margin:0;color:#6B6461;font-size:15px;line-height:1.5;text-wrap:pretty">When guests come back they tell us whether they went and would recommend it. With those numbers we can approach the places we already send guests to and arrange a small welcome.</p>
            </div>
          </div>
          <p style="color:#6B6461;margin:18px 0 0;font-size:15px;text-wrap:pretty">We record the three answers and nothing else. We do not record names, room numbers or email addresses, and because the suggestions are kept on the guest&#x2019;s own phone rather than in a system of ours, there is no record that could be traced back to an individual.</p>
        </div>

        <p style="background:#F7EEF0;border:1px solid #E2B7C3;border-radius:8px;padding:12px 16px;font-size:15px;margin:0 0 30px;color:#6E1B36"><b>The figures below are invented.</b> They are here to show the shape of what one month would look like, not to report real results.</p>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:#DDD7D2;border:1px solid #DDD7D2;border-radius:10px;overflow:hidden;margin-bottom:34px">
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">612</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">suggestions given in a month</span></div>
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">31%</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">went somewhere we suggested</span></div>
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">84%</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">would send another guest there</span></div>
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">58%</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">had an hour or less</span></div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px 48px;align-items:center;margin-bottom:40px">
          <div>
        <h3 style="font-size:20px;margin:0 0 6px;font-weight:700;color:#A50034">Which language our guests chose</h3>
        <p style="color:#6B6461;margin:0;text-wrap:pretty">The page opens in four languages, and the one a guest picks is the fifth thing we learn. It costs nothing to record and it tells the desk something useful: which greetings are worth learning, whose public holiday is coming up, and which nationalities we should be readier for in a given month.</p>
          </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#DDD7D2;border:1px solid #DDD7D2;border-radius:10px;overflow:hidden">
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">54%</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">English</span></div>
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">21%</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">Nederlands</span></div>
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">16%</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">Deutsch</span></div>
          <div style="background:#fff;padding:18px"><b style="display:block;font-size:34px;line-height:1;font-weight:700;color:#A50034">9%</b><span style="display:block;font-size:14.5px;color:#6B6461;margin-top:7px">Espa&#xF1;ol</span></div>
        </div>
        </div>

        <div style="display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px 48px;align-items:start;margin:0 0 40px;padding-top:28px;border-top:1px solid #DDD7D2">
        <h3 style="font-size:20px;margin:0;font-weight:700;color:#A50034">What our guests asked for</h3>
        <div style="display:flex;flex-direction:column">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4">
            <div style="display:grid;grid-template-columns:minmax(140px,210px) minmax(0,1fr) 46px;gap:12px;align-items:center;padding:7px 0;font-size:15.5px">
              <span>{{ b.label }}</span>
              <span style="display:block;background:#E6E1DD;height:16px;border-radius:3px;overflow:hidden"><span style="display:block;background:#A50034;height:100%;width:{{ b.w }}"></span></span>
              <em style="font-style:normal;color:#6B6461;font-size:14.5px;text-align:right">{{ b.pct }}</em>
            </div>
          </sc-for>
        </div>
        </div>

        <h3 style="font-size:20px;margin:0 0 6px;font-weight:700;color:#A50034">A small thank you our guests can actually use</h3>
        <p style="color:#6B6461;margin:0 0 20px;text-wrap:pretty">We send these places a steady number of guests every month, and at the moment neither they nor our guests get anything from it. The idea is not a commission for the hotel. It is a small welcome that belongs to the guest, arranged by us, which costs the hotel nothing and is the sort of thing people mention in their reviews.</p>

        <div style="overflow-x:auto;border:1px solid #DDD7D2;border-radius:10px;background:#fff">
          <table style="width:100%;border-collapse:collapse;font-size:15.5px;min-width:640px">
            <thead><tr>
              <th style="text-align:left;padding:12px 14px;border-bottom:1px solid #DDD7D2;font-weight:600;font-size:14px;color:#6B6461;background:#EFEBE8">Partner</th>
              <th style="text-align:left;padding:12px 14px;border-bottom:1px solid #DDD7D2;font-weight:600;font-size:14px;color:#6B6461;background:#EFEBE8">Suggested / visited</th>
              <th style="text-align:left;padding:12px 14px;border-bottom:1px solid #DDD7D2;font-weight:600;font-size:14px;color:#6B6461;background:#EFEBE8">Would recommend</th>
              <th style="text-align:left;padding:12px 14px;border-bottom:1px solid #DDD7D2;font-weight:600;font-size:14px;color:#6B6461;background:#EFEBE8">What our guest would receive</th>
              <th style="text-align:left;padding:12px 14px;border-bottom:1px solid #DDD7D2;font-weight:600;font-size:14px;color:#6B6461;background:#EFEBE8">Why they would be glad to</th>
            </tr></thead>
            <tbody>
              <tr>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top"><b>De Poentjak</b><br><span style="font-size:14px;color:#6B6461">Kneuterdijk, {{ hotel.dPoentjak }} min</span></td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">124 / 51<br><span style="font-size:14px;color:#6B6461">41% went</span></td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">92%</td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">A table kept for our guests before 19:15</td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">They fill up after 19:15 in any case. This fills the quieter half hour before it.</td>
              </tr>
              <tr>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top"><b>Het IJskabinet</b><br><span style="font-size:14px;color:#6B6461">Plaats, {{ hotel.dIjs }} min</span></td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">96 / 58<br><span style="font-size:14px;color:#6B6461">60% went</span></td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">88%</td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">A scoop on the house when you show your room key</td>
                <td style="padding:12px 14px;border-bottom:1px solid #DDD7D2;vertical-align:top">It costs them very little, and families rarely stop at one.</td>
              </tr>
              <tr>
                <td style="padding:12px 14px;vertical-align:top"><b>Filmhuis Den Haag</b><br><span style="font-size:14px;color:#6B6461">Spui, {{ hotel.dFilmhuis }} min</span></td>
                <td style="padding:12px 14px;vertical-align:top">77 / 19<br><span style="font-size:14px;color:#6B6461">25% went</span></td>
                <td style="padding:12px 14px;vertical-align:top">79%</td>
                <td style="padding:12px 14px;vertical-align:top">&#x20AC;2 off a weeknight ticket, or a coffee at the caf&#xE9;</td>
                <td style="padding:12px 14px;vertical-align:top">Their weeknight screenings are quiet, and weeknights are when our guests are here.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <p style="color:#6B6461;margin:26px 0 40px;text-wrap:pretty">The middle column is the one to watch. Somewhere we suggest a hundred times and our guests visit twelve times is too far, too expensive or closing too early, and it can come off the list without anyone needing to argue about it.</p>

        <h3 style="font-size:20px;margin:0 0 6px;font-weight:700;color:#A50034">What guests tell us in their own words</h3>
        <p style="color:#6B6461;margin:0 0 20px;text-wrap:pretty">The comment box gives us the two things a tick box never will: places we have not thought of, and how our guests were treated once they arrived somewhere on our recommendation.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 40px">
          <div style="background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:16px 18px;font-size:15.5px;text-wrap:pretty">We were seated straight away when we said we were staying at the hotel. Very kind staff.<span style="display:block;margin-top:6px;font-size:14px;color:#6B6461">after De Poentjak</span></div>
          <div style="background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:16px 18px;font-size:15.5px;text-wrap:pretty">Lovely food, but they had stopped serving by the time we arrived at 21:00. Perhaps worth mentioning at the desk.<span style="display:block;margin-top:6px;font-size:14px;color:#6B6461">after Fat Kee</span></div>
          <div style="background:#fff;border:1px solid #DDD7D2;border-radius:10px;padding:16px 18px;font-size:15.5px;text-wrap:pretty">We found a wonderful little bookshop caf&#xE9; on Noordeinde that you should add to your list.<span style="display:block;margin-top:6px;font-size:14px;color:#6B6461">somewhere else worth knowing</span></div>
        </div>

        <div style="border:1px solid #DDD7D2;background:#fff;border-radius:10px;padding:20px 22px">
          <h3 style="margin:0 0 14px;font-size:18px;color:#A50034">About our guests' privacy</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 28px">
          <p style="margin:0;font-size:15.5px;color:#6B6461;text-wrap:pretty">We keep three answers per visit: the time available, the travel context and the preference. No name, no room number and no email address, so nothing here can be traced back to a guest.</p>
          <p style="margin:0;font-size:15.5px;color:#6B6461;text-wrap:pretty">The suggestions are saved on the guest's own phone. There is no account, no code and no identifier of any kind, which means there is no record anywhere that could single out a guest. What reaches the hotel is a count for each place and nothing more.</p>
          <p style="margin:0;font-size:15.5px;color:#6B6461;text-wrap:pretty">Our partners receive a number, never a list. The welcome is claimed by showing a room key at the door, so no guest details ever leave the hotel.</p>
          </div>
        </div>

      if (child.nodeType === 3) {
        const txt = child.nodeValue;
        out.appendChild(document.createTextNode(RX.test(txt) ? interp(txt, scope) : txt));
        RX.lastIndex = 0;
        continue;
      }
      if (child.nodeType !== 1) continue;
      const tag = child.tagName.toLowerCase();

      if (tag === 'sc-if') {
        if (interp(child.getAttribute('value') || '', scope)) build(child, scope, out, ns);
        continue;
      }
      if (tag === 'sc-for') {
        const list = interp(child.getAttribute('list') || '', scope) || [];
        const as = child.getAttribute('as') || 'item';
        for (const item of list) {
          const inner = Object.create(scope);
          inner[as] = item;
          build(child, inner, out, ns);
        }
        continue;
      }
      if (tag === 'dc-import') {
        const props = {};
        for (const a of child.attributes) {
          if (a.name === 'name' || a.name.startsWith('hint-')) continue;
          props[camel(a.name)] = interp(a.value, scope);
        }
        const holder = document.createElement('div');
        out.appendChild(holder);
        mountComponent(child.getAttribute('name'), props, holder);
        continue;
      }

      const childNs = ns || (tag === 'svg' ? SVG_NS : null);
      const el = childNs ? document.createElementNS(childNs, tag) : document.createElement(tag);
      for (const a of child.attributes) {
        const name = a.name, value = a.value;
        if (name.startsWith('hint-')) continue;
        if (/^on[A-Z]/.test(name) || /^on(click|change|input)$/i.test(name)) {
          const fn = interp(value, scope);
          if (typeof fn === 'function') {
            const evt = name.toLowerCase() === 'onchange' ? 'input' : name.toLowerCase().slice(2);
            el.addEventListener(evt, fn);
          }
          continue;
        }
        if (name === 'style-hover' || name === 'style-active') {
          const css = interp(value, scope);
          const enter = name === 'style-hover' ? ['mouseenter', 'mouseleave'] : ['mousedown', 'mouseup'];
          el.addEventListener(enter[0], () => el.setAttribute('style', el.dataset.baseStyle + ';' + css));
          el.addEventListener(enter[1], () => el.setAttribute('style', el.dataset.baseStyle));
          continue;
        }
        const v = interp(value, scope);
        if (name === 'value' && (tag === 'textarea' || tag === 'input')) { el.value = v == null ? '' : v; continue; }
        if (name === 'disabled') { if (v) el.setAttribute('disabled', ''); continue; }
        if (v === false || v == null) { if (name.startsWith('aria-')) el.setAttribute(name, 'false'); continue; }
        el.setAttribute(name, v === true ? 'true' : String(v));
        if (name === 'style') el.dataset.baseStyle = String(v);
      }
      build(child, scope, el, childNs);
      out.appendChild(el);
    }
  }

  /* ---- component registry ---- */
  const registry = {};
  window.dcRegister = (name, Klass, templateId) => { registry[name] = { Klass, templateId }; };

  function mountComponent(name, props, host) {
    const entry = registry[name];
    if (!entry) return null;
    const tpl = document.getElementById(entry.templateId).content;
    const mount = inst => {
      const snap = snapshotFocus(host);
      const frag = document.createDocumentFragment();
      build(tpl, inst.renderVals(), frag);
      host.textContent = '';
      host.appendChild(frag);
      restoreFocus(host, snap);
    };
    const inst = new entry.Klass(props, host, mount);
    mount(inst);
    if (inst.componentDidMount) inst.componentDidMount();
    return inst;
  }
  window.dcMount = mountComponent;
})();

const THEMES = {
  hiex: { primary:'#003271', accent:'#F26B21', onPrimaryMuted:'#B7C6DE', perkBg:'#FDEEE4', perkFg:'#B34A0F', font:"'Source Sans 3', system-ui, sans-serif", cat:{eat:'#F26B21', sweet:'#C2185B', air:'#2E8B57', see:'#003271', off:'#7A5288'} },
  ibis: { primary:'#A50034', accent:'#1E1E1E', onPrimaryMuted:'rgba(255,255,255,.75)', perkBg:'#F7EEF0', perkFg:'#A50034', font:"'Nunito Sans', system-ui, sans-serif", cat:{eat:'#A50034', sweet:'#D4587A', air:'#4C8C4A', see:'#1E1E1E', off:'#8A7465'} }
};
const KEY = 'hiex-guestdesk.v2';
const mins = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; };

class Component extends DCLogic {
  state = { L: null, screen: 0, ans: { time: null, who: null, mood: null }, saved: null, okMsg: '', sent: false, run: 0, now: new Date() };
  componentDidMount() { this.setState({ saved: this.load() }); this.tick = setInterval(() => this.setState({ now: new Date() }), 60000); }
  componentWillUnmount() { clearInterval(this.tick); }
  theme() { return THEMES[this.props.theme || this.q('theme')] || THEMES[this.hotelKey()] || THEMES.hiex; }
  cat() { return this.theme().cat; }
  q(k) { try { return new URLSearchParams(location.search).get(k); } catch (e) { return null; } }
  hotelKey() { const h = this.props.hotel || this.q('hotel'); return HOTELS[h] ? h : 'hiex'; }
  key() { return KEY + '.' + this.hotelKey(); }
  load() { try { return JSON.parse(localStorage.getItem(this.key())) || null; } catch (e) { return null; } }
  save(v) { try { localStorage.setItem(this.key(), JSON.stringify(v)); } catch (e) {} }
  lang() { return this.state.L || this.props.lang || 'en'; }
  go(screen) { this.setState({ screen }); }
  hoursToday(p, now) {
    const d = now.getDay();
    if (!p.days.includes(d)) return null;
    return (p.hd && p.hd[d]) || p.hours;
  }
  // returns {state:'always'|'open'|'soon'|'later'|'closed', until, next}
  status(p, now) {
    const h = this.hoursToday(p, now);
    if (h === null) return { state: 'closed' };
    if (!h.length) return { state: 'always', left: 9999 };
    const cur = now.getHours()*60 + now.getMinutes();
    for (const [o, c] of h) {
      let co = mins(o), cc = mins(c); if (cc <= co) cc += 24*60;
      if (cur >= co && cur < cc) return { state: cc - cur <= 45 ? 'soon' : 'open', until: c, left: cc - cur };
    }
    const next = h.find(([o]) => mins(o) > cur);
    return next ? { state: 'later', next: next[0], left: 0, opens: mins(next[0]) - cur } : { state: 'closed' };
  }
  // need: minutes of useful time required once there; travel: minutes to get there
  fits(p, st, time, travel) {
    if (st.state === 'closed') return false;
    if (st.state === 'always') return true;
    const need = { half: 20, hour: 40, afternoon: 60, evening: 75 }[time] || 40;
    if (st.state === 'open' || st.state === 'soon') return st.left - travel >= need;
    // opens later today: acceptable only for afternoon/evening, and within a reasonable wait
    if (time === 'afternoon') return st.opens <= 120 && mins(st.next) < 16*60;
    if (time === 'evening') return st.opens <= 150 && mins(st.next) <= 20*60;
    return false;
  }
  ranked(all) {
    const { ans, now, run } = this.state, hk = this.hotelKey();
    const list = P.map(p => {
      const st = this.status(p, now), w = p.w[hk], far = p.via || w > 10;
      let s = 0;
      if (p.mood.includes(ans.mood)) s += 5;
      if (p.who.includes(ans.who)) s += 3;
      if (p.time.includes(ans.time)) s += 4;
      if ((ans.time === 'half' || ans.time === 'hour') && far) s -= 8;
      if (ans.time === 'half' && w > 6) s -= 4;
      if ((ans.time === 'half' || ans.time === 'hour') && w <= 8 && !p.via) s += 2;
      if (st.state === 'soon' && ans.time !== 'half') s -= 2;
      if (!this.fits(p, st, ans.time, p.via ? 20 : w)) s = -99;
      s += (hash(p.id + ':' + run) % 100) / 100 * 1.5; // gentle variation between runs
      return { p, s, st, w, far, fits: s > -50 };
    });
    return (all ? list.filter(x => x.fits) : list.filter(x => x.s > 3)).sort((a, b) => b.s - a.s || a.w - b.w);
  }
  pick() {
    const r = this.ranked(), top = r.slice(0, 3);
    let far = null;
    if (this.state.ans.time === 'afternoon' || this.state.ans.time === 'evening') {
      const ids = top.map(x => x.p.id), mood = this.state.ans.mood;
      far = this.ranked(true).find(x => x.far && !ids.includes(x.p.id) && x.p.mood.includes(mood)) || null;
    }
    return { top, far };
  }
  answer(g, v) {
    const ans = { ...this.state.ans, [g]: v };
    const step = g === 'time' ? 1 : g === 'who' ? 2 : 3;
    if (step === 3) {
      this.setState({ ans, now: new Date() }, () => {
        const { top, far } = this.pick(), prev = this.load() || {};
        const list = top.map(x => x.p).concat(far ? [far.p] : []);
        const saved = { places: list.map(p => ({ n: p.n, went: null, rec: null })), other: prev.other || '', service: prev.service || '', lang: this.lang() };
        this.save(saved);
        this.setState({ saved, screen: 4, sent: false, okMsg: '' });
      });
    } else this.setState({ ans, screen: step + 1 });
  }
  setRev(i, f, v) {
    const d = { ...this.state.saved, places: this.state.saved.places.map((p, k) => k === i ? { ...p, [f]: v } : p) };
    this.save(d); this.setState({ saved: d });
  }
  setField(f, v) { const d = { ...this.state.saved, [f]: v }; this.save(d); this.setState({ saved: d, okMsg: LANGS[this.lang()].saved }); }
  card(x, T, L) {
    const { p, st, w } = x, hk = this.hotelKey();
    const dist = p.via ? p.via[L] : w + ' ' + T.walk;
    const h = this.hoursToday(p, this.state.now) || [];
    const hours = h.length ? h.map(([o, c]) => o + '\u2013' + c).join(', ') : '';
    const status = st.state === 'always' ? T.always : st.state === 'open' ? T.openNow : st.state === 'soon' ? T.closesSoon + ' \u00B7 ' + st.until : st.state === 'later' ? T.opensAt + ' ' + st.next : T.closed;
    const statusColor = st.state === 'open' || st.state === 'always' ? '#2E8B57' : st.state === 'soon' || st.state === 'later' ? '#B34A0F' : '#8A94A6';
    const q = encodeURIComponent(p.n + ' ' + p.a + ' Den Haag');
    const ig = IG[p.id] ? 'https://www.instagram.com/' + IG[p.id] + '/' : p.noIg ? 'https://www.google.com/maps/search/?api=1&query=' + q : 'https://www.instagram.com/explore/search/keyword/?q=' + encodeURIComponent(p.n);

      accentOr: this.theme().accent,
      progPct: isQ ? (screen / 3 * 100) + '%' : screen >= 4 ? '100%' : '0%',
      isS0: screen === 0, isQ, isS4: screen === 4, isS5: screen === 5,
      stepLabel: isQ ? T.step[screen - 1] : '', question: isQ ? T.q[screen - 1] : '',

      start: () => this.go(1), back: () => this.go(screen - 1),

<script>
/* Pitch - logic verbatim from the original design file */
const Pitch = (function () {
const HOTELS = {
  hiex: { mark:'H', name:'Holiday Inn Express', line:'The Hague \u2014 Parliament \u00B7 Lange Houtstraat 5', full:'Holiday Inn Express The Hague \u2014 Parliament', dPoentjak:9, dIjs:5, dFilmhuis:6 },
  ibis: { mark:'i', name:'ibis Den Haag City Centre', line:'Jan Hendrikstraat 10', full:'ibis Den Haag City Centre', dPoentjak:7, dIjs:6, dFilmhuis:9 }
};
const TABS = [['guest','1 \u00B7 Try it as a guest'],['hotel','2 \u00B7 Why I built this']];

class Component extends DCLogic {
  state = { tab: null };
  tab() { return this.state.tab || this.props.startTab || 'guest'; }
  renderVals() {
    const tab = this.tab(), hotelKey = HOTELS[this.props.hotel] ? this.props.hotel : 'ibis';
    return {
      hotelKey, hotel: HOTELS[hotelKey],
      tabs: TABS.map(([k, label]) => ({ label, on: tab === k, fg: tab === k ? '#fff' : 'rgba(255,255,255,.72)', line: tab === k ? '#A50034' : 'transparent', pick: () => { this.setState({ tab: k }); window.scrollTo({ top: 0 }); } })),
      isGuest: tab === 'guest', isHotel: tab === 'hotel',
      bars: [['Somewhere nearby to eat', 38], ['Fresh air, a walk, the sea', 24], ['A museum or something beautiful', 21], ['Somewhere to sit and unwind', 17]].map(([label, p]) => ({ label, w: p + '%', pct: p + '%' }))
    };
  }
}
return Component;
})();
dcRegister('Pitch', Pitch, 'tpl-pitch');
const pitchInstance = dcMount('Pitch', {}, document.getElementById('pitch-root'));

/* the old cross-file link now just switches back to the first tab */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go-guest]');
  if (!a) return;
  e.preventDefault();
  pitchInstance.setState({ tab: 'guest' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
